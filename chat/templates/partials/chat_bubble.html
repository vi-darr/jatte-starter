<div id="chat" class="fixed right-2 bottom-2 max-w-full p-4 bg-white border border-gray-300 rounded-xl">
    <div id="chat_icon">
        <button id="chat_open" class="flex items-center w-[50px] cursor-pointer">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1" stroke="currentColor" class="text-slate-700">
                 <path stroke-linecap="round" stroke-linejoin="round" d="M20.25 8.511c.884.284 1.5 1.128 1.5 2.097v4.286c0 1.136-.847 2.1-1.98 2.193-.34.027-.68.052-1.02.072v3.091l-3-3c-1.354 0-2.694-.055-4.02-.163a2.115 2.115 0 0 1-.825-.242m9.345-8.334a2.126 2.126 0 0 0-.476-.095 48.64 48.64 0 0 0-8.048 0c-1.131.094-1.976 1.057-1.976 2.192v4.286c0 .837.46 1.58 1.155 1.951m9.345-8.334V6.637c0-1.621-1.152-3.026-2.76-3.235A48.455 48.455 0 0 0 11.25 3c-2.115 0-4.198.137-6.24.402-1.608.209-2.76 1.614-2.76 3.235v6.226c0 1.621 1.152 3.026 2.76 3.235.577.075 1.157.14 1.74.194V21l4.155-4.155" />
            </svg>
        </button>
    </div>

    <div id="chat_welcome" class="hidden">
        <input type="text" name="name" id="chat_name" class="w-full mb-4 py-2 px-6 rounded-xl bg-gray-100" placeholder="Yourn Name">

        <button id="chat_join" class="py-2 px-6 rounded-xl text-white bg-slate-700 cursor-pointer">
            Join Chat
        </button>
    </div>

    <div id="chat_room" class="hidden">
        <button class="cursor-pointer mr-1 font-bold text-lg" id="fullscreenBtn" title="Fullscreen">⛶</button>
        <button class="cursor-pointer font-bold text-lg" id="closeBtn" title="Close">&times;</button>
        
        <div id="chat_log" class="mb-4 p-4 bg-gray-100 rounded-xl h-[300px] overflow-y-auto">
            <p class="mt-2 bg-gray-300 p-1 rounded-xl text-center text-gray-600">
                Welcome to our chat. Please type your message and wait for an agent to join
            </p>
        </div>

        <input type="text" name="body" id="chat_message_input" class="w-full mb-4 p-4 bg-gray-100 rounded-xl" placeholder="Type here">
        <button id="chat_message_submit" class="py-2 px-6 bg-slate-700 text-white rounded-xl cursor-pointer">
            Send
        </button>
    </div>

    <div id="chat_rating" class="hidden">
        <h3 class="text-lg font-semibold mb-3">How was your experience?</h3>

        <div class="mb-3">
            <label class="block text-sm font-medium text-gray-700 mb-1">Overall Rating <span class="text-rose-600">*</span></label>
            <div class="star-rating flex gap-1" data-field="overall_rating">
                <button type="button" data-value="1" class="star-btn text-2xl text-gray-300 cursor-pointer hover:text-yellow-400">★</button>
                <button type="button" data-value="2" class="star-btn text-2xl text-gray-300 cursor-pointer hover:text-yellow-400">★</button>
                <button type="button" data-value="3" class="star-btn text-2xl text-gray-300 cursor-pointer hover:text-yellow-400">★</button>
                <button type="button" data-value="4" class="star-btn text-2xl text-gray-300 cursor-pointer hover:text-yellow-400">★</button>
                <button type="button" data-value="5" class="star-btn text-2xl text-gray-300 cursor-pointer hover:text-yellow-400">★</button>
            </div>
        </div>

        <div class="mb-3">
            <label class="block text-sm font-medium text-gray-700 mb-1">Responsiveness</label>
            <div class="star-rating flex gap-1" data-field="responsiveness">
                <button type="button" data-value="1" class="star-btn text-xl text-gray-300 cursor-pointer hover:text-yellow-400">★</button>
                <button type="button" data-value="2" class="star-btn text-xl text-gray-300 cursor-pointer hover:text-yellow-400">★</button>
                <button type="button" data-value="3" class="star-btn text-xl text-gray-300 cursor-pointer hover:text-yellow-400">★</button>
                <button type="button" data-value="4" class="star-btn text-xl text-gray-300 cursor-pointer hover:text-yellow-400">★</button>
                <button type="button" data-value="5" class="star-btn text-xl text-gray-300 cursor-pointer hover:text-yellow-400">★</button>
            </div>
        </div>

        <div class="mb-3">
            <label class="block text-sm font-medium text-gray-700 mb-1">Helpfulness</label>
            <div class="star-rating flex gap-1" data-field="helpfulness">
                <button type="button" data-value="1" class="star-btn text-xl text-gray-300 cursor-pointer hover:text-yellow-400">★</button>
                <button type="button" data-value="2" class="star-btn text-xl text-gray-300 cursor-pointer hover:text-yellow-400">★</button>
                <button type="button" data-value="3" class="star-btn text-xl text-gray-300 cursor-pointer hover:text-yellow-400">★</button>
                <button type="button" data-value="4" class="star-btn text-xl text-gray-300 cursor-pointer hover:text-yellow-400">★</button>
                <button type="button" data-value="5" class="star-btn text-xl text-gray-300 cursor-pointer hover:text-yellow-400">★</button>
            </div>
        </div>

        <div class="mb-3">
            <label class="block text-sm font-medium text-gray-700 mb-1">Comment</label>
            <textarea id="rating_comment" rows="3" class="w-full p-2 bg-gray-100 rounded-xl text-sm" placeholder="Tell us more (optional)"></textarea>
        </div>

        <div class="flex gap-2">
            <button id="rating_submit" class="py-2 px-6 bg-slate-700 text-white rounded-xl cursor-pointer">Submit</button>
            <button id="rating_skip" class="py-2 px-4 bg-gray-200 text-gray-700 rounded-xl cursor-pointer">Skip</button>
        </div>

        <p id="rating_thank_you" class="hidden mt-3 text-sm text-green-600 font-medium">Thank you for your feedback!</p>
        <p id="rating_error" class="hidden mt-3 text-sm text-rose-600 font-medium"></p>
    </div>
</div>
