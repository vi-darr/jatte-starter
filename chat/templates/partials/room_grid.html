<div class="grid grid-cols-4 gap-4">
                {%  for room in rooms %}
                    <div class="p-4 rounded-xl {% if room.status == 'waiting' %}bg-emerald-100{% elif room.status == 'active' %}bg-yellow-200{% else %}bg-gray-100{% endif %}">
                        <h3 class="mb-4 text-lg"><strong>Chat Room: </strong>{{ room.uuid }}</h3>
                        
                        <p>
                            <b>Name:</b> {{ room.client }}<br>
                            <b>Status:</b> {{ room.get_status_display }}<br>
                            <b>Agent:</b> {% firstof room.agent.name 'None yet...' %}<br>
                        </p>

                        <a href="{% url 'chat:room' room.uuid %}" class="inline-block py-2 px-6 mt-4 bg-emerald-800 text-white rounded-xl">Join</a>
                        
                        {% if perms.user.delete_room %}
                            <a href="{% url 'chat:delete_room' room.uuid %}" class="inline-block py-2 px-6 mt-4 bg-rose-800 text-white rounded-xl">Delete</a>
                        {% endif %}
                    </div>
                {% endfor %}
        </div>
