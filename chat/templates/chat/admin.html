{% extends 'core/base.html' %}

{% block content %}
   <h1 class="text-2xl">Chat Admin</h1>

   {% if perms.user.add_user %}
        <div class="mt-8">
            <h2 class="mb-4 text-lg">Users</h2>

            <div class="mt-6 mb-4">
                {% for user in users %}
                    <div class="grid grid-cols-4 gap-4 py-2 rounded-l {% cycle 'bg-gray-100' '' %}">
                        <p class="px-2">{{ user.name }}</p>
                        <p class="px-2">{{ user.email }}</p>
                        <p class="px-2">{{ user.get_role_display }}</p>
                        <p class="px-2 text-right">
                            <a href="#" class="underline">Edit</a>
                        </p>
                    </div>
                {% endfor %}
            </div>

            <a href="#" class="inline-block py-2 px-6 bg-rose-600 text-white rounded-xl">Add User</a>
        </div>
   {% endif %}

   <hr class="my-6">

   <div class="mt-8">
        <h2 class="mb-4 text-lg"><strong>Rooms</strong></h2>

        {% include 'partials/room_grid.html' %}
    </div>
{% endblock %}
